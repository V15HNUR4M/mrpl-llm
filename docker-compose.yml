version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    environment:
      - SQLITE_URL=sqlite+aiosqlite:///./data/mrpl.db
      - SECRET_KEY=test-secret-key-12345
    restart: unless-stopped
